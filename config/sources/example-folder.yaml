# Beispiel-Quellkonfiguration (generisch). Pro Mandant eine Datei.
#
# Der Ordner-Connector scannt das Wurzelverzeichnis REKURSIV: PSR dürfen beliebig
# tief und verstreut liegen (z. B. ein Unterordner je Projekt). Welche .docx
# tatsächlich ein PSR ist, entscheidet die Ingestion inhaltsbasiert.

type: folder
path: ./sample-data/psr

# Später (gleiche Ingestion dahinter):
