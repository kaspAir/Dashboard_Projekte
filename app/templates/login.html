<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Projekt-Dashboard</title>
<style>
  body{margin:0;background:#f5f6f8;color:#1f2937;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
       font-size:14px;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:28px;width:360px;max-width:92vw}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#6b7280;font-size:13px;margin-bottom:18px}
  label{display:block;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 6px}
  input{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit}
  button{width:100%;margin-top:18px;background:#1f2937;color:#fff;border:0;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
  .err{background:#fdecec;border:1px solid #f3c2c2;color:#a12020;border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13px}
  .env{color:#9aa4b2;font-size:11px;text-align:center;margin-top:14px}
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>Anmelden</h1>
    <div class="sub">Projekt-Dashboard</div>
    <label for="email">E-Mail</label>
    <input type="email" id="email" name="email" autocomplete="username" required>
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Anmelden</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <div class="env">Umgebung: {{ env }}</div>
  </form>
</body>
</html>
