# Priorität, zuständige Einheit/Bereich. Das Ist (Kosten/Aufwand, Ampel) kommt zur
# Laufzeit aus den Statusberichten.
#
# budgetrahmen: der einer Abteilung/einem Ressort zugeteilte Projektbudget-Rahmen,
# innerhalb dessen sie ihre Projekte durchführt (Rahmen vs. Verbrauch/Prognose).
#
# Bewusste Demo-Fälle:
#   - M-2026-013 (freigegeben, noch kein PSR)  -> "ohne Bericht"
#   - M-2025-011 (BiblioCloud) fehlt hier      -> "läuft ohne erfassten Auftrag"

