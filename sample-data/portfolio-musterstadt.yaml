# Portfolio-Soll der Stadt Musterstadt (gepflegt, NICHT aus den PSR abgeleitet).
#
# kpi_katalog: je Portfolio konfigurierbar. Der Kunde definiert eigene KPIs, ihre
#   Art, Skala, Richtung und ihr Gewicht -> daraus berechnet das Tool die Priorität.
#     art: tor       = Muss (sticht das Scoring), an eine Frist gekoppelt
#          bewertung = manuell bewertet (0..skala), treibt die Priorität
#          messung   = aus den PSR gemessen (hier angezeigt; Gewicht optional)
#     richtung: positiv = höher erhöht Priorität, negativ = höher senkt sie
#
# vorhaben[].kpis: die erfassten Werte je Vorhaben. Fehlt ein Wert -> "unbekannt"
#   (wird NICHT als 0 gewertet). Das Tor trägt { pflicht, frist, grund, konsequenz }.

kpi_katalog:
  - { id: rechtlich,     name: "Rechtliche Verpflichtung", art: tor }
  - { id: strategie,     name: "Strategiebeitrag",   art: bewertung, skala: 4, richtung: positiv, gewicht: 3 }
  - { id: nutzen,        name: "Nutzen / Wirkung",    art: bewertung, skala: 4, richtung: positiv, gewicht: 3 }
  - { id: politisch,     name: "Politische Priorität", art: bewertung, skala: 4, richtung: positiv, gewicht: 2 }
  - { id: dringlichkeit, name: "Dringlichkeit",       art: bewertung, skala: 4, richtung: positiv, gewicht: 2 }
  - { id: risiko,        name: "Umsetzungsrisiko",    art: bewertung, skala: 4, richtung: negativ, gewicht: 2 }
  - { id: budgettreue,   name: "Budgettreue",         art: messung,   quelle: psr, richtung: negativ, gewicht: 0 }

budgetrahmen:
  bereich:
    "Ressort Finanzen": 1300000
    "Ressort Bau & Umwelt": 1800000        # Projekte prognostizieren darüber -> Warnung
    "Ressort Bildung": 400000
    "Ressort Soziales & Gesundheit": 650000
    "Ressort Sicherheit": 1200000

